# Shared Python <-> Rust deterministic 6DOF CTBR fixture.
#
# Expected states were produced by the Python FixedStepRuntime using the tracked
# vehicle config.  Both implementations use IEEE-754 f64 math but differ in
# independent matrix/inverse implementations, so 1e-9 absolute tolerance is
# intentionally tight while allowing harmless round-off ordering differences.
name = "python-rust-6dof-ctbr-disturbance-v1"
vehicle_config_path = "config/vehicles/flightstack_5in.toml"
dt_s = 0.002

[tolerances]
state_abs = 1.0e-9
quaternion_abs = 1.0e-9

[initial_state]
sim_time_s = 0.0
position_world_m = [0.4, -0.2, 1.3]
velocity_world_m_s = [0.7, -0.35, 0.1]
q_body_to_world_wxyz = [0.99217983738367421, 0.063601798956203284, -0.033736331216950757, 0.10195999909209931]
body_rate_rad_s = [0.18, -0.1, 0.07]
motor_thrust_n = [1.7, 1.4, 1.6, 1.5]

[disturbance]
