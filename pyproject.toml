[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flightstack"
version = "0.1.0"
description = "Simulation-first quaternion attitude control and HIL toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Paul Boyko"}]
# NumPy 2.5's public stubs require Python 3.12 syntax while FlightStack still
# type-checks its supported Python 3.11 baseline.  Keep the runtime range broad
# but prevent a fresh 3.11 CI install from receiving incompatible stubs.
dependencies = [
  "aiohttp>=3.10",
  "numpy>=1.26,<2.5",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "gymnasium>=0.29",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
train = [
  "gymnasium>=0.29",
  "stable-baselines3>=2.3",
]

[project.scripts]
flightstack = "flightstack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["flightstack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
