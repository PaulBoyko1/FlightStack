# FlightStack state-based racing policy contract, v1.
#
# The authoritative physics remains `config/vehicles/flightstack_5in.toml` and
# the Python FixedStepRuntime.  This file versions only training-facing
# normalisation, episode, and reward choices so checkpoints can be inspected
# and reproduced without hard-coded source constants.

[environment]
schema_version = "flightstack-race-environment-v1"
physics_dt_s = 0.002
control_substeps = 10
max_episode_s = 50.0
max_distance_from_course_m = 30.0
max_altitude_m = 7.0
vehicle_radius_m = 0.13

# Deterministic per-reset uniform start perturbations.  They are sampled from
# the seed supplied to `reset(seed=...)`; set these to zero for an exact
# nominal-start study.
initial_xy_jitter_m = 0.20
initial_altitude_jitter_m = 0.05
initial_yaw_jitter_rad = 0.10

[observation]
schema_version = "flightstack-race-observation-v1"
# Ordered 27-float layout (all values are clipped to their documented range):
#  0:3   body-frame world velocity / body_velocity_scale_m_s          [-1, 1]
#  3:6   body angular rate / configured max body rate                 [-1, 1]
#  6:9   body-frame vector to next gate / gate_vector_scale_m         [-1, 1]
#  9:12  next gate normal expressed in body                           [-1, 1]
# 12:15  body-frame vector to gate after next / gate_vector_scale_m   [-1, 1]
# 15:18  gate-after-next normal expressed in body                     [-1, 1]
# 18:21  world-up vector expressed in body                            [-1, 1]
# 21:25  previous normalized CTBR action                              [-1, 1]
# 25     distance to next gate / distance_scale_m                     [ 0, 1]
# 26     world speed / speed_scale_m_s                                [ 0, 1]
# No quaternion is fed to the policy: local vectors avoid q/-q ambiguity.
body_velocity_scale_m_s = 18.0
gate_vector_scale_m = 24.0
distance_scale_m = 40.0
speed_scale_m_s = 24.0

[reward]
schema_version = "flightstack-race-reward-v1"
# Progress is `(previous distance to target) - (current distance to target)`
# in metres.  Gate/lap bonuses and failure penalties are event-driven.  The
# remaining values are deliberately signed weights so telemetry can expose the
# contribution of every term without hidden reward arithmetic.
progress_per_m = 1.0
gate_pass = 5.0
lap_complete = 20.0
collision = -12.0
out_of_bounds = -12.0
action_delta = -0.03
angular_rate = -0.002
time_per_s = -0.02
